# Codecov config. Coverage is a work in progress (issue #7), so statuses are
# informational for now — they report on the PR but never fail the build.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# A compact, readable PR comment: overall diff + per-file changes, posted once
# and updated in place.
comment:
  layout: "condensed_header, diff, files, components"
  behavior: default
  require_changes: false

# Only the hand-written client source is meaningful; mirror .vscode-test.mjs.
ignore:
  - "client/test/**"
  - "client/webview/**"
  - "**/node_modules/**"
  - "src/**"          # F# server, covered by its own .NET tooling
  - "build/**"
