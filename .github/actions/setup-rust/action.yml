---
name: Setup Rust
description: Install a Rust toolchain and cache cargo registry and target

inputs:
  toolchain:
    description: rustup toolchain name or version
    default: stable
  components:
    description: Comma-separated rustup components
    default: ""
  targets:
    description: Comma-separated rustup targets
    default: ""
  cache-prefix:
    description: Target cache key prefix. Must differ across build profiles.
    default: cargo-target
  cache-target-path:
    description: Directory to cache as the cargo target dir
    default: engine/target
  cargo-tool:
    description: Cargo-installed executable to cache
    default: ""
  cargo-tool-version:
    description: Exact version of the Cargo-installed executable
    default: ""

outputs:
  cargo-tool-cache-hit:
    description: Whether the requested Cargo tool was restored from cache
    value: ${{ steps.cargo-tool-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      # stable branch, 2026-03-27
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    # Registry sources are shared across jobs. Cargo-installed executables
    # use an exact, versioned cache below so unrelated jobs never replace one.
    - name: Cache cargo registry
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: >-
          ${{ runner.os }}-cargo-registry-${{
          hashFiles('engine/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-
    - name: Cache cargo tool
      id: cargo-tool-cache
      if: inputs.cargo-tool != '' && inputs.cargo-tool-version != ''
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cargo/bin/${{ inputs.cargo-tool }}
        key: >-
          ${{ runner.os }}-cargo-tool-${{ inputs.cargo-tool }}-${{
          inputs.cargo-tool-version }}-${{ inputs.toolchain }}
    - name: Cache cargo target
      # v6.1.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ inputs.cache-target-path }}
        key: >-
          ${{ runner.os }}-${{ inputs.cache-prefix }}-${{
          hashFiles('engine/Cargo.lock', 'engine/**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-prefix }}-
