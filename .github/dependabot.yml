---
version: 2
updates:
  # SHA-pinned; dependabot rewrites the pin and its version comment together.
  - package-ecosystem: github-actions
    directories:
      - /
      # `/` covers workflows but not composite actions.
      - /.github/actions/setup-node-npm
      - /.github/actions/setup-rust
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        applies-to: version-updates
        patterns:
          - "*"

  # The Rust engine. MSRV is declared in engine/Cargo.toml and the "Rust
  # MSRV build" job in ci.yml fails any update whose own rust-version
  # climbs past it, so a floor bump is a red check rather than something a
  # reviewer has to spot. cargo-deny in the rust lint job is the advisory gate.
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Split out so a fix never queues behind a routine version bump.
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Majors stay individual. Grouped across 15 crates one is a rewrite,
      # not a review.
      cargo:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint peers typescript <6.1.0, so a major bump here breaks
      # `npm ci` outright. Drop this once typescript-eslint supports it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # v3 replaced the `cy.use(popper)` registration the webview is written
      # against with a factory. Needs a code change, not a version bump.
      - dependency-name: cytoscape-popper
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/cytoscape-popper"
        update-types:
          - version-update:semver-major
    groups:
      # Split out so a fix never queues behind a routine version bump.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
      npm-development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
