version: 2
updates:
  # SHA-pinned; dependabot rewrites the pin and its version comment together.
  - package-ecosystem: github-actions
    directories:
      - /
      # `/` covers workflows but not composite actions.
      - /.github/actions/setup-node-npm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        applies-to: version-updates
        patterns:
          - "*"

  # Engine bumps auto-merge once CI passes (automerge-engine.yml), so daily
  # keeps the pin close to engine main without manual work.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore

  # `/release` is the shipped manifest and resolves its own dependency set.
  - package-ecosystem: npm
    directories:
      - /
      - /release
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint peers typescript <6.1.0, so a major bump here breaks
      # `npm ci` outright. Drop this once typescript-eslint supports it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # v3 replaced the `cy.use(popper)` registration the webview is written
      # against with a factory. Needs a code change, not a version bump.
      - dependency-name: cytoscape-popper
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/cytoscape-popper"
        update-types:
          - version-update:semver-major
    groups:
      # Split out so a fix never queues behind a routine version bump.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
      npm-development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
