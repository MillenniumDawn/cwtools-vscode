on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.13-beta)"
        required: true
      dry-run:
        description: "Dry run — validate without publishing"
        type: boolean
        default: false

name: Publish to Marketplace

permissions:
  contents: read

# One publish at a time; never cancel an in-flight one.
concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - uses: ./.github/actions/setup-node-npm

      # Download the vsix asset from the specified GitHub release.
      - name: Download vsix from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, not inline: an inline ${{ }} is a shell injection sink.
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # An empty tag makes gh fetch the latest release, not fail.
          [ -n "$TAG" ] || { echo "::error::tag input is empty"; exit 1; }
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "*.vsix" \
            --dir vsix-artifacts
          echo "Downloaded vsix:"
          find vsix-artifacts -maxdepth 1 -type f -print

      - name: Publish to VS Code Marketplace
        if: ${{ inputs.dry-run == false }}
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            error="VSCE_TOKEN secret is not set."
            echo "::error::$error Add it to the repository secrets."
            exit 1
          fi
          mapfile -t vsixes < <(find vsix-artifacts -maxdepth 1 -type f \
            -name '*.vsix' -print | sort)
          # Every platform vsix in one publish call, not one platform at a time.
          npx @vscode/vsce publish --pat "$VSCE_TOKEN" --packagePath "${vsixes[@]}"

      - name: Dry run (validate only)
        if: ${{ inputs.dry-run == true }}
        run: |
          mapfile -t vsixes < <(find vsix-artifacts -maxdepth 1 -type f \
            -name '*.vsix' -print | sort)
          echo "Dry run — would publish:"
          printf '  %s\n' "${vsixes[@]}"
          # generate-manifest actually opens each vsix and reads its contents,
          # so a corrupt or malformed package fails the step.
          for vsix in "${vsixes[@]}"; do
            npx @vscode/vsce generate-manifest --packagePath "$vsix"
          done
          echo "Dry run complete. No changes published."
