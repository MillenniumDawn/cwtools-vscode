on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.13-beta)'
        required: true
      dry-run:
        description: 'Dry run — validate without publishing'
        type: boolean
        default: false

name: Publish to Marketplace

permissions:
  contents: read

# One publish at a time; never cancel an in-flight one.
concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: ./.github/actions/setup-node-npm

    # Download the vsix asset from the specified GitHub release.
    - name: Download vsix from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Via env, not inline: an inline ${{ }} is a shell injection sink.
        TAG: ${{ inputs.tag }}
        REPO: ${{ github.repository }}
      run: |
        gh release download "$TAG" \
          --repo "$REPO" \
          --pattern "*.vsix" \
          --dir vsix-artifacts
        echo "Downloaded vsix:"
        ls -la vsix-artifacts/

    - name: Publish to VS Code Marketplace
      if: ${{ inputs.dry-run == false }}
      env:
        VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
      run: |
        if [ -z "$VSCE_TOKEN" ]; then
          echo "::error::VSCE_TOKEN secret is not set. Add it to the repository secrets."
          exit 1
        fi
        vsix=$(ls vsix-artifacts/*.vsix | head -1)
        npx @vscode/vsce publish --pat "$VSCE_TOKEN" --packagePath "$vsix"

    - name: Dry run (validate only)
      if: ${{ inputs.dry-run == true }}
      run: |
        vsix=$(ls vsix-artifacts/*.vsix | head -1)
        echo "Dry run — would publish: $vsix"
        npx @vscode/vsce ls-publish --pat dummy --packagePath "$vsix" || true
        echo "Dry run complete. No changes published."
