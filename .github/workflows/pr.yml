on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

name: Test

permissions:
  contents: read

# Newer pushes to the same branch/PR supersede in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: typecheck, lint, and unit tests. Gives contributors quick
  # feedback while the heavier jobs catch up.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: ./.github/actions/setup-node-npm
    - name: Typecheck and lint
      run: npm run check
    - name: Node unit tests
      run: npm run test:node
    - name: Unit tests
      run: xvfb-run -a npm test

  # Full build: compile client, package vsix, run coverage. Validates the
  # complete packaging pipeline and produces the artifact.
  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-node-npm
    - name: Test build
      run: npm run build -- package
    # Host V8 coverage (vscode-test + c8) is not run in CI: the instrumented
    # Electron process never exits under xvfb, so c8 waits for it until the job
    # timeout (previously the full 6h cap). The unit suites are already gated in
    # the `check` job, so host coverage stays a local tool (`npm run
    # test:coverage`, which completes normally outside CI). Node coverage below
    # is the report published to the PR.
    - name: Node unit tests (with coverage)
      if: always()
      run: npm run test:node:coverage
    - name: Coverage summary
      if: always()
      run: npx tsx build/coverage-summary.ts
    # Readable coverage table straight on the PR, kept in place across pushes.
    # Open source, uses the built-in GITHUB_TOKEN, so it needs no extra secrets.
    - name: Coverage PR comment
      if: always() && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
      with:
        header: coverage
        path: coverage/summary.md
    - name: 'Upload node coverage'
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-node
        path: coverage-node
        retention-days: 5
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cwtools-vscode-pipeline.vsix
        path: temp/*.vsix
        retention-days: 5
