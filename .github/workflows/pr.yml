on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

name: Test

permissions:
  contents: read

# Newer pushes to the same branch/PR supersede in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: typecheck, lint, and unit tests. Gives contributors quick
  # feedback while the heavier jobs catch up.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-node-npm
    - name: Typecheck and lint
      run: npm run check
    - name: Node unit tests
      run: npm run test:node
    - name: Unit tests
      run: xvfb-run -a npm test

  # Catches a vulnerable dependency before merge, not as an alert after.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high
        comment-summary-in-pr: on-failure

  # Full build: compile the engine and the client, run the host smoke suite
  # against the real server, package the vsix, run coverage. This is the only
  # place a submodule bump gets compiled before a release tag builds it for
  # real, so it checks out the submodule and builds it.
  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-node-npm
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, 2026-03-27
    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: submodules/cwtools/cwtools-rs
    # Builds the pinned engine and the client into release/, the same layout a
    # developer gets from ./build.sh quick.
    - name: Build engine and client
      env:
        CWTOOLS_RUST_WORKSPACE: submodules/cwtools/cwtools-rs
      run: npm run build -- quick
    # Boots the extension host against the freshly built server: activation,
    # command registration and the graph/file-explorer UI. The full `host`
    # label additionally covers hover and completion, which need rule data the
    # sample workspace can't resolve (see .vscode-test.mjs).
    - name: Host smoke tests
      run: xvfb-run -a npm run test:smoke
    # Packages what was just built, server included, so the PR artifact is an
    # installable extension rather than a client-only shell.
    - name: Test build
      run: npm run build -- package-prebuilt
    # Host V8 coverage (vscode-test + c8) is not run in CI: the instrumented
    # Electron process never exits under xvfb, so c8 waits for it until the job
    # timeout (previously the full 6h cap). The unit suites are already gated in
    # the `check` job, so host coverage stays a local tool (`npm run
    # test:coverage`, which completes normally outside CI). Node coverage below
    # is the report published to the PR.
    - name: Node unit tests (with coverage)
      if: always()
      run: npm run test:node:coverage
    - name: Coverage summary
      if: always()
      run: npx tsx build/coverage-summary.ts
    # Readable coverage table straight on the PR, kept in place across pushes.
    # Open source, uses the built-in GITHUB_TOKEN, so it needs no extra secrets.
    - name: Coverage PR comment
      if: always() && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: coverage
        path: coverage/summary.md
    - name: 'Upload node coverage'
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-node
        path: coverage-node
        retention-days: 5
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cwtools-vscode-pipeline.vsix
        path: temp/*.vsix
        retention-days: 5
