on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

name: Test

# Central version pins — update these when bumping toolchains.
env:
  NODE_VERSION: '20'

jobs:
  # Fast gate: typecheck, lint, and unit tests. Gives contributors quick
  # feedback while the heavier jobs catch up.
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ env.NODE_VERSION }}
    - run: npm install
    - name: Typecheck and lint
      run: npm run check
    - name: Node unit tests
      run: npm run test:node
    - name: Unit tests
      run: xvfb-run -a npm test

  # Full build: compile client, package vsix, run coverage. Validates the
  # complete packaging pipeline and produces the artifact.
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        submodules: recursive
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ env.NODE_VERSION }}
    - run: npm install
    - name: Test build
      run: npm run build -- package
    # Runs the unit suites with V8 coverage. Same suites as the old `npm test`
    # step, so it gates the same way; the coverage is non-gating (no threshold).
    - name: Test (with coverage)
      run: xvfb-run -a npm run test:coverage
    # Node-only unit suites (vitest + v8); no Electron, so no xvfb. Covers the
    # modules the host run excludes (engine.ts, executable.ts).
    - name: Node unit tests (with coverage)
      if: always()
      run: npm run test:node:coverage
    - name: Coverage summary
      if: always()
      run: npx tsx build/coverage-summary.ts
    # Readable coverage table straight on the PR, kept in place across pushes.
    # Open source, uses the built-in GITHUB_TOKEN, so it needs no extra secrets.
    - name: Coverage PR comment
      if: always() && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
      with:
        header: coverage
        path: coverage/summary.md
    # The full istanbul HTML report (generated locally by c8) for line-by-line
    # browsing — open coverage/index.html from this artifact.
    - name: 'Upload coverage'
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-html
        path: coverage
        retention-days: 5
    - name: 'Upload node coverage'
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-node
        path: coverage-node
        retention-days: 5
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cwtools-vscode-pipeline.vsix
        path: temp/*.vsix
        retention-days: 5
