---
# Cuts the release once the release PR lands. Fires on every push to main and
# does nothing unless the head commit's manifest version matches the top
# changelog heading and no tag for it exists yet -- which is only true of the
# commit that merged release-pr.yml's branch.
"on":
  push:
    branches:
      - main

name: Tag release

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the existing tags are present to check against.
          # Credentials are kept (no persist-credentials: false) on purpose:
          # this job pushes the release tag.
          fetch-depth: 0
      - name: Check whether this push cut a release
        id: check
        run: |
          version=$(python3 <<'PY'
          import json
          from pathlib import Path

          manifest = Path("extension/package/package.json")
          print(json.loads(manifest.read_text(encoding="utf-8"))["version"])
          PY
          )
          top=$(grep -m1 -oE '^#+ +v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "manifest=$version changelog=$top"
          if [ "$version" != "$top" ]; then
            echo "Manifest and changelog disagree; not a release commit."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists; nothing to cut."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Push the release tag
        if: ${{ steps.check.outputs.release == 'true' }}
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

  # A tag pushed with GITHUB_TOKEN starts no workflow, so the release is called
  # rather than triggered. release.yml keeps its own tag-push trigger, so
  # `npm run build -- release` still works by hand.
  release:
    needs: tag
    if: ${{ needs.tag.outputs.release == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit
