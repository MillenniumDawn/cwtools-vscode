# Weekly PR bumping the reviewed runtime manifest and bundled fallback pins.
# Every install fetches only the exact commits this PR approves
# The pins are consumed by extension/src/host/rulesSetup.ts, so an upstream
# push cannot land unreviewed.
# Nothing here auto-merges; the diffs are the point.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: Rules pins

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.pins.outputs.changed }}
      summary: ${{ steps.pins.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bump the pins
        id: pins
        run: |
          pins=(extension/src/host/games.ts rules-pins.json)
          summary=$(python3 scripts/build/rules_pins.py)
          echo "$summary"
          if git diff --quiet -- "${pins[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<EOF'
            echo "$summary"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # A GITHUB_TOKEN PR doesn't start Test, so the gates run here rather
      # than handing over an unchecked diff. These steps are skipped when the
      # pins are already current, keeping the weekly no-change path cheap.
      - uses: ./.github/actions/setup-node-npm
        if: steps.pins.outputs.changed == 'true'
        with:
          cache-vscode: true
      - name: Client checks
        if: steps.pins.outputs.changed == 'true'
        run: |
          npm run check
          npm run test:node
      - uses: ./.github/actions/setup-rust
        if: steps.pins.outputs.changed == 'true'
        with:
          cache-prefix: cargo-release-target
      - name: Build engine and client
        if: steps.pins.outputs.changed == 'true'
        run: npm run build -- quick
      - name: Rules-sync host tests
        if: steps.pins.outputs.changed == 'true'
        timeout-minutes: 10
        run: npm run test:rules-sync
      - name: Upload changed pins
        if: steps.pins.outputs.changed == 'true'
        # v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rules-pins
          path: |
            extension/src/host/games.ts
            rules-pins.json
          if-no-files-found: error
          retention-days: 1

  pr:
    if: needs.bump.outputs.changed == 'true'
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download changed pins
        # v4.3.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rules-pins
          path: .
      - name: Commit and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
          RULES_SUMMARY: ${{ needs.bump.outputs.summary }}
        run: |
          pins=(extension/src/host/games.ts rules-pins.json)
          branch="rules-pins/$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m 'chore: bump the pinned rules commits' -- "${pins[@]}"
          gh auth setup-git
          git push origin "$branch"
          description='Weekly refresh of the reviewed rules manifest'
          description+=' by scripts/build/rules_pins.py.'
          body=$(printf '%s\n\n%s\n\n' "$description" "$RULES_SUMMARY")
          body+=$(printf '%s %s\n' \
            'Installed extensions fetch these exact commits.' \
            'Read the upstream diffs before merging.')
          gh pr create --base main --head "$branch" \
            --title 'chore: bump the pinned rules commits' \
            --body "$body"
