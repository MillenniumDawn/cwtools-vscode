# Weekly PR bumping the reviewed runtime manifest and bundled fallback pins.
# Every install fetches only the exact commits this PR approves
# (client/extension/rulesSetup.ts), so an upstream push cannot land unreviewed.
# Unlike the engine bump, nothing here auto-merges.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: Rules pins

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
      - name: Bump the pins and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pins=(client/extension/games.ts rules-pins.json)
          summary=$(npx tsx build/rulesPins.ts)
          echo "$summary"
          if git diff --quiet -- "${pins[@]}"; then
            exit 0
          fi
          # A GITHUB_TOKEN PR doesn't start Test, so the gates run here rather
          # than handing over an unchecked diff.
          npm run check
          npm run test:node
          branch="rules-pins/$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -m 'chore: bump the pinned rules commits' -- "${pins[@]}"
          git push origin "$branch"
          body=$(printf '%s\n\n%s\n\n' \
            'Weekly refresh of the reviewed rules manifest by build/rulesPins.ts.' \
            "$summary")
          body+=$(printf '%s %s\n' \
            'Installed extensions fetch these exact commits.' \
            'Read the upstream diffs before merging.')
          gh pr create --base main --head "$branch" \
            --title 'chore: bump the pinned rules commits' \
            --body "$body"
