name: Engine CI

# The Rust half of the suite. pr.yml ("Test") gates the TypeScript client and
# builds the engine once for the host tests; this gates the engine itself.
# No path filtering: a client-only change still has to prove the engine it
# ships builds, lints and passes on every platform a release binary targets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

# Default to least privilege; individual jobs widen as needed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

# Dependency review lives in pr.yml, once for the whole repository. It reads
# every manifest in the diff, so the merged repo's Cargo.lock is covered there
# alongside package-lock.json. cargo-deny (deny.yml) remains the primary
# advisory + license gate for Rust.

jobs:
  lint-rs:
    name: Rust format / clippy / unused-deps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cwtools-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, 2026-03-27
        with:
          components: rustfmt, clippy
      # Registry cache (rarely changes, separate from target so a lockfile
      # bump doesn't invalidate the compiled artifacts). `~/.cargo/bin` rides
      # along so cargo-machete is restored instead of recompiled every run.
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: >-
            ${{ runner.os }}-cargo-registry-${{
            hashFiles('cwtools-rs/Cargo.lock') }}
      # Target cache: save even on failure so a cancelled build doesn't
      # force a full rebuild on the next run.
      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cwtools-rs/target
          key: >-
            ${{ runner.os }}-cargo-target-${{
            hashFiles('cwtools-rs/Cargo.lock', 'cwtools-rs/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-
          save-always: true
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features --
          -D warnings
      - name: cargo machete (unused dependencies)
        run: |
          cargo install cargo-machete --locked --force
          cargo machete
      # Keeps the engine's inheritance posture (repository, [lints], shared
      # test deps) from drifting when a new crate is added. Runs from repo root
      # so the script can see both cwtools-rs/ and scripts/.
      - name: workspace manifest inheritance
        working-directory: ${{ github.workspace }}
        run: python3 scripts/workspace_manifest.py
      - name: scripts unit tests
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  # Releases ship Linux, Windows, and macOS binaries, so a platform-only
  # break must fail here before it ships. The tag-triggered release workflow
  # separately builds the server binaries the vsix bundles.
  test-rs:
    name: Rust build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cwtools-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, 2026-03-27
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            ${{ runner.os }}-cargo-registry-${{
            hashFiles('cwtools-rs/Cargo.lock') }}
      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cwtools-rs/target
          key: >-
            ${{ runner.os }}-cargo-target-${{
            hashFiles('cwtools-rs/Cargo.lock', 'cwtools-rs/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-
          save-always: true
      # Same feature set as the test step below, or the test step recompiles
      # every crate whose features differ instead of reusing these artifacts.
      - name: cargo build (debug)
        run: cargo build --workspace --all-targets --all-features
      - name: cargo test
        run: cargo test --workspace --all-features --no-fail-fast

  # A declared MSRV nobody builds at is a comment. Stable is 1.95; the floor is
  # 1.88 (let-chains), so seven releases' worth of newer APIs compile fine on a
  # developer machine and break the MSRV silently. This job is what makes
  # `rust-version` in cwtools-rs/Cargo.toml mean something.
  msrv-rs:
    name: Rust MSRV build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cwtools-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Read the version out of Cargo.toml rather than repeating it here, so
      # bumping the MSRV is a one-line change and can't leave CI testing the
      # old floor.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -m1 -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error::no rust-version found in cwtools-rs/Cargo.toml"
            exit 1
          fi
          echo "Declared MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, 2026-03-27
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            ${{ runner.os }}-cargo-registry-${{
            hashFiles('cwtools-rs/Cargo.lock') }}
      # Keyed on the MSRV: a different rustc invalidates every fingerprint, so
      # sharing the stable job's target cache would just force two full rebuilds
      # per run. The prefix is `msrv-target` rather than `cargo-target-msrv`
      # because the other jobs restore-key on `cargo-target-`, which would
      # otherwise match this cache and hand them a target dir built by 1.88.
      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cwtools-rs/target
          key: >-
            ${{ runner.os }}-msrv-target-${{
            steps.msrv.outputs.version }}-${{
            hashFiles('cwtools-rs/Cargo.lock', 'cwtools-rs/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-msrv-target-${{ steps.msrv.outputs.version }}-
          save-always: true
      # The `+${{ ... }}` is load-bearing. rust-toolchain.toml pins the channel
      # to stable, and a directory toolchain file outranks whatever rustup
      # default the install step set, so a bare `cargo build` here would quietly
      # build on stable and this job would pass no matter what the MSRV is.
      - name: cargo build at MSRV
        run: >-
          cargo +${{ steps.msrv.outputs.version }} build --workspace
          --all-targets

  # Fuzzing in CI is a smoke run, not a fuzzing campaign: -runs=0 replays the
  # committed seed corpus once and exits. Deterministic, ~seconds of target
  # time, and it re-checks the two crashes the seeds encode (the reversed slice
  # panic on a lone `'` in a Jomini param, and clause nesting past the depth
  # cap). A real campaign is nondeterministic and belongs on a machine that can
  # run for hours, not on the PR path where a fresh find would turn every
  # unrelated PR red.
  fuzz-smoke:
    name: Fuzz seed-corpus smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cwtools-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-fuzz needs nightly. Pinned to a date for the same reason every
      # `uses:` here is pinned to a SHA: an unpinned nightly means a toolchain
      # regression lands as a red build on an unrelated PR. Bump it deliberately
      # when there's a reason to.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, 2026-03-27
        with:
          toolchain: nightly-2026-07-24
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            ${{ runner.os }}-cargo-registry-${{
            hashFiles('cwtools-rs/Cargo.lock') }}
      - name: Cache fuzz target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cwtools-rs/fuzz/target
          key: >-
            ${{ runner.os }}-cargo-fuzz-target-${{
            hashFiles('cwtools-rs/fuzz/Cargo.toml', 'cwtools-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-target-
          save-always: true
      # Explicit +toolchain throughout: rust-toolchain.toml says stable, and
      # letting it win would make rustup fetch a second toolchain to run
      # cargo-fuzz on, which then can't build the nightly-only targets.
      # Version-pinned, unlike the cargo-machete install above: `fuzz run`'s
      # positional-corpus and `-- -runs=0` handling is the whole contract this
      # job depends on, and a cargo-fuzz that changed it would break the job
      # rather than the code.
      - name: Install cargo-fuzz
        run: >-
          cargo +nightly-2026-07-24 install cargo-fuzz --version 0.13.2
          --locked
      - name: parse_string over seed corpus
        run: >-
          cargo +nightly-2026-07-24 fuzz run parse_string
          fuzz/seeds/parse_string -- -runs=0
      - name: parse_loc_text over seed corpus
        run: >-
          cargo +nightly-2026-07-24 fuzz run parse_loc_text
          fuzz/seeds/parse_loc_text -- -runs=0

  # Coverage is a hard target, but this path starts with a 85% line floor so
  # we can see which gaps remain before making it a required gate. The report
  # step is continue-on-error, so this job reports the number without failing
  # the run on it; the lcov artifact is the record.
  coverage-rs:
    name: Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cwtools-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (stable + llvm tools)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, 2026-03-27
        with:
          components: llvm-tools
      # Registry cache (including ~/.cargo/bin) helps cargo-llvm-cov install
      # reuse across runs.
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: >-
            ${{ runner.os }}-cargo-registry-${{
            hashFiles('cwtools-rs/Cargo.lock') }}
      # Cache target output so repeated runs avoid rebuilds.
      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cwtools-rs/target
          key: >-
            ${{ runner.os }}-cargo-coverage-target-${{
            hashFiles('cwtools-rs/Cargo.lock', 'cwtools-rs/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-target-
          save-always: true
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.8.7
      - name: Run coverage (85% line floor)
        env:
          COVERAGE_THRESHOLD: 85
        run: python3 ../scripts/coverage.py
        continue-on-error: true
      # Named for the engine so it can't collide with the client's
      # coverage-node artifact in pr.yml.
      - name: Upload lcov report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-coverage-lcov
          path: cwtools-rs/target/coverage/lcov.info
          if-no-files-found: error
