on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  schedule:
    # Weekly sweep so new queries hit the existing code, not just new commits.
    - cron: '17 6 * * 1'
  workflow_dispatch:

name: CodeQL

permissions:
  contents: read

concurrency:
  # event_name keeps a push to main from cancelling the weekly sweep.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # Rust lives in the cwtools repo and is scanned there.
        language:
          - javascript-typescript
          - actions

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Initialize CodeQL
      uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
      with:
        languages: ${{ matrix.language }}
        # security-extended over security-and-quality: no maintainability noise.
        queries: security-extended
    - name: Analyze
      uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
      with:
        category: /language:${{ matrix.language }}
