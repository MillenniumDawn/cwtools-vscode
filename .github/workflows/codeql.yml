on:
  push:
    branches:
      - 'main'
  pull_request:
  schedule:
    # Weekly sweep so new queries hit the existing code, not just new commits.
    - cron: '17 6 * * 1'
  workflow_dispatch:

name: CodeQL

permissions:
  contents: read

concurrency:
  # event_name keeps a push to main from cancelling the weekly sweep.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Rust extraction over the whole engine workspace is the long pole here;
    # the other two finish in minutes.
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # Both halves of the monorepo, plus the workflows themselves.
        language:
          - javascript-typescript
          - rust
          - actions

    steps:
    # fetch-depth: 0 so the alert baseline can be attributed to the commit that
    # introduced it rather than to the shallow cut.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        languages: ${{ matrix.language }}
        # security-extended over security-and-quality: no maintainability noise.
        queries: security-extended
    - name: Analyze
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        category: /language:${{ matrix.language }}
