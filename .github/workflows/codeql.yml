on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  schedule:
    # Weekly sweep so new queries hit the existing code, not just new commits.
    - cron: '17 6 * * 1'
  workflow_dispatch:

name: CodeQL

permissions:
  contents: read

concurrency:
  # event_name keeps a push to main from cancelling the weekly sweep.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # Rust lives in the cwtools repo and is scanned there.
        language:
          - javascript-typescript
          - actions

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        languages: ${{ matrix.language }}
        # security-extended over security-and-quality: no maintainability noise.
        queries: security-extended
    - name: Analyze
      uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        category: /language:${{ matrix.language }}
