---
# Keeps a release pull request open against main. Every push to main
# regenerates release/version-bump from origin/main: the changelog's
# `### Unreleased` section becomes a version heading and the extension manifest
# moves to the same version. Merging that PR is what cuts a release --
# publish.yml takes it from there.
#
# Two runs can still race the merge button: the run for the push before the
# release merge checks out a main that still has the Unreleased bullets, and by
# the time it looks for an open PR the release PR has merged, so it opens a
# second one. Two guards close that: the push step yields when main moved
# since checkout (the newer run is queued behind this one and takes over), and
# the "nothing to release" path closes whatever PR is left on the branch.
"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Which part of the version to bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

name: Release PR

permissions:
  contents: read

# Never cancel: two runs racing would fight over the same branch.
concurrency:
  group: release-pull-request
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: release/version-bump
      BUMP: ${{ inputs.release_type || 'patch' }}
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflow, so CI would never
      # run against it. An App installation token does trigger workflows, and
      # unlike a PAT it leaves no person as the author of the release PR.
      - name: Mint a GitHub App token
        id: app-token
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.RELEASE_PR_APP_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # Credentials are kept on purpose: this job pushes the release branch.
          token: ${{ steps.app-token.outputs.token }}
      # The branch is regenerated from origin/main on every push rather than
      # merged forward, so the edit is always the same mechanical rewrite and
      # nothing can conflict. Hand edits pushed to it are discarded; fixes
      # belong in main's `### Unreleased`.
      - name: Prepare the release commit
        id: prepare
        run: |
          git checkout -B "$BRANCH" origin/main
          echo "base=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          python3 scripts/build/release_pr.py --bump "$BUMP" \
            >> "$GITHUB_OUTPUT"
      # A release merged after this run checked out main, or any other push,
      # means a newer run is already queued behind this one with the right
      # tree. Pushing this one would put a stale "Release x.y.z" on the branch
      # and, if the release PR just merged, open a second one for it.
      - name: Push the release branch
        id: push
        if: ${{ steps.prepare.outputs.release == 'true' }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          BASE: ${{ steps.prepare.outputs.base }}
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
            echo "main moved since checkout; the newer run takes over."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md extension/package/package.json
          git commit -m "Release $VERSION"
          git push --force origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the release pull request
        if: ${{ steps.push.outputs.pushed == 'true' }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          title="Release $VERSION"
          body_file="$RUNNER_TEMP/release-pr-body.md"
          {
            echo "Promotes the changelog's \`### Unreleased\` section to"
            echo "\`### $VERSION\` and moves"
            echo "\`extension/package/package.json\` to the same version."
            echo
            echo "Merging this PR cuts the release: the \`Publish\` workflow"
            echo "builds every platform, smoke-tests the VSIX files, and"
            echo "publishes them to the VS Code Marketplace, Open VSX, and"
            echo "GitHub Releases as three independent jobs. The"
            echo "\`v$VERSION\` tag is created by the GitHub one, so a release"
            echo "that fails to publish is retried by the next push to main."
            echo
            echo "This branch is regenerated from \`main\` on every push, so"
            echo "edits made here are discarded. Correct the release notes in"
            echo "\`main\`'s \`### Unreleased\` section instead."
            echo
            echo "Bump: \`$BUMP\`. Re-run \`release-pr.yml\` with a different"
            echo "\`release_type\` to change it."
          } > "$body_file"
          number=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" \
              --title "$title" --body-file "$body_file"
          else
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "$title" --body-file "$body_file"
          fi
      # Nothing to release means no release PR should be open. The one that
      # can be is the duplicate a racing run opened after the release merged
      # (see the header), and this run is queued behind that one, so closing
      # it here is what makes the branch converge.
      - name: Close a stale release pull request
        if: ${{ steps.prepare.outputs.release != 'true' }}
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          number=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open release pull request; nothing to close."
            exit 0
          fi
          echo "Closing stale release pull request #$number."
          comment="Nothing left to release on \`main\`: the release this pull"
          comment="$comment request carried has already merged."
          comment="$comment Closed by \`release-pr.yml\`."
          gh pr close "$number" --repo "$REPO" --delete-branch \
            --comment "$comment"
