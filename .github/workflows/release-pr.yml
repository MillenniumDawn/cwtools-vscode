---
# Keeps a release pull request open against main. Every push to main
# regenerates release/version-bump from origin/main: the changelog's
# `### Unreleased` section becomes a version heading and the extension manifest
# moves to the same version. Merging that PR is what cuts a release --
# tag-release.yml takes it from there.
"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Which part of the version to bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

name: Release PR

permissions:
  contents: read

# Never cancel: two runs racing would fight over the same branch.
concurrency:
  group: release-pull-request
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: release/version-bump
      BUMP: ${{ inputs.release_type || 'patch' }}
      # A PR opened with GITHUB_TOKEN triggers no workflow, so CI never runs
      # against it. With RELEASE_PR_TOKEN (a PAT) the PR gets real checks.
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_PAT: ${{ secrets.RELEASE_PR_TOKEN != '' }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # Credentials are kept on purpose: this job pushes the release branch.
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
      # The branch is regenerated from origin/main on every push rather than
      # merged forward, so the edit is always the same mechanical rewrite and
      # nothing can conflict. Hand edits pushed to it are discarded; fixes
      # belong in main's `### Unreleased`.
      - name: Prepare the release commit
        id: prepare
        run: |
          git checkout -B "$BRANCH" origin/main
          python3 scripts/build/release_pr.py --bump "$BUMP" \
            >> "$GITHUB_OUTPUT"
      - name: Push the release branch
        if: ${{ steps.prepare.outputs.release == 'true' }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md extension/package/package.json
          git commit -m "Release $VERSION"
          git push --force origin "$BRANCH"
      - name: Open or update the release pull request
        if: ${{ steps.prepare.outputs.release == 'true' }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          title="Release $VERSION"
          body_file="$RUNNER_TEMP/release-pr-body.md"
          {
            echo "Promotes the changelog's \`### Unreleased\` section to"
            echo "\`### $VERSION\` and moves"
            echo "\`extension/package/package.json\` to the same version."
            echo
            echo "Merging this PR cuts the release: \`tag-release.yml\` pushes"
            echo "\`v$VERSION\` and calls the Release workflow, which builds"
            echo "every platform, smoke-tests the VSIX files, and publishes to"
            echo "the Marketplace and Open VSX."
            echo
            echo "This branch is regenerated from \`main\` on every push, so"
            echo "edits made here are discarded. Correct the release notes in"
            echo "\`main\`'s \`### Unreleased\` section instead."
            echo
            echo "Bump: \`$BUMP\`. Re-run \`release-pr.yml\` with a different"
            echo "\`release_type\` to change it."
            if [ "$HAS_PAT" != "true" ]; then
              echo
              echo "> Opened with \`GITHUB_TOKEN\`, so the checks on this PR"
              echo "> are advisory: CI was dispatched against the branch"
              echo "> instead of the merge commit."
            fi
          } > "$body_file"
          number=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" \
              --title "$title" --body-file "$body_file"
          else
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "$title" --body-file "$body_file"
          fi
      # Without a PAT the PR itself starts no workflow. Dispatch CI against the
      # branch so the release commit is at least built and tested somewhere.
      - name: Dispatch CI against the release branch
        if: >-
          ${{ steps.prepare.outputs.release == 'true'
          && env.HAS_PAT != 'true' }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
