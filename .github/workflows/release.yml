---
"on":
  # Push a v* tag to build, package, and publish the release. workflow_dispatch
  # is a manual fallback.
  push:
    tags:
      - "v*"
  # tag-release.yml calls this after pushing the tag itself. A tag pushed with
  # GITHUB_TOKEN starts no workflow, so the merge path calls in rather than
  # relying on the trigger above.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v3.4.1)"
        required: true
        type: string
      version:
        description: "The version that tag carries, without the leading v"
        required: true
        type: string
  workflow_dispatch:

name: Release

permissions:
  contents: read

# Never cancel an in-flight release; queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the Rust server natively on each platform. To add or remove a
  # platform, edit the matrix below -- the staging step is platform-agnostic.
  build-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bin: cwtools-server
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            bin: cwtools-server
          - os: windows-latest
            platform: win-x64
            target: x86_64-pc-windows-msvc
            bin: cwtools-server.exe
          - os: macos-latest
            platform: osx-arm64
            target: aarch64-apple-darwin
            bin: cwtools-server
          # Intel Macs. The client resolves osx-x64 there, so without this build
          # every Intel Mac install ends at "no language server binary found".
          # Cross-compiled from the arm64 runner; the Apple toolchain links both
          # slices, so only the rust target needs adding.
          - os: macos-latest
            platform: osx-x64
            target: x86_64-apple-darwin
            bin: cwtools-server
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ROOT: engine/target
    steps:
      # The engine lives in-repo at engine/, so the tag names both halves
      # at once: the commit being released is the engine being bundled.
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # On the workflow_call path github.ref is the caller's branch, so the
          # tag has to be named explicitly.
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Setup Rust
        # stable branch, 2026-03-27
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        # v2.9.1
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine
      - name: Build server
        working-directory: engine
        run: cargo build --release -p cwtools_lsp --target ${{ matrix.target }}
      - name: Upload binary
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-${{ matrix.platform }}
          path: >-
            ${{ env.ROOT }}/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  # Stage the binaries, package one vsix, and publish it.
  publish:
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Creating the GitHub release needs write access; GITHUB_TOKEN is read-only
    # by default.
    permissions:
      contents: write
    env:
      HAS_OPEN_VSX: ${{ secrets.OPEN_VSX_TOKEN != '' }}
      # True for a tag push and for the workflow_call from tag-release.yml;
      # false for a manual dispatch off a branch, which builds but skips the
      # Marketplace requirement.
      TAG_RELEASE: >-
        ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
      # Empty on the tag-push path, where the version comes from the ref.
      CWTOOLS_RELEASE_TAG: ${{ inputs.tag }}
      CWTOOLS_BUILD_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
        with:
          persist-credentials: false
          # workflow_dispatch has no head_ref; fall back to the
          # dispatched branch.
          ref: ${{ inputs.tag || github.head_ref || github.ref_name }}
      - name: Download server binaries
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: server-*
          path: artifacts/server
      - uses: ./.github/actions/setup-node-npm
      - name: Assemble extension
        run: npm run compile:release
      - name: Stage binaries into dist/extension
        run: >-
          python3 scripts/stage_release_binaries.py
          artifacts/server dist/extension
      - name: Require Marketplace token on tagged releases
        # Fail fast (before creating the GitHub release) when a real tag release
        # is missing the Marketplace PAT, instead of silently skipping the
        # publish.
        if: ${{ env.TAG_RELEASE == 'true' }}
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            message="VSCE_TOKEN secret is not set; cannot publish"
            echo "::error::$message a tagged release to the Marketplace."
            exit 1
          fi
      # One vsix per platform plus a universal fallback. No clean or rebuild:
      # the binaries are already staged under dist/extension/bin/server.
      - name: Package vsix
        run: npm run build -- package-prebuilt
      # Checks every packaged vsix. The per-platform ones carry exactly their
      # own binary, while the universal fallback carries all of them. The
      # platform list is passed explicitly so a silently shrunken build matrix
      # fails here. Runs before the publish, so a broken package can't reach the
      # Marketplace.
      - name: Smoke test vsix
        run: |
          python3 scripts/smoke_test_vsix.py artifacts/vsix \
            linux-x64 linux-arm64 win-x64 osx-arm64 osx-x64
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        # The version comes from the pushed tag; the build doesn't commit or
        # re-tag.
        run: npm run build -- publish-prebuilt
      # Open VSX takes the universal vsix the smoke test just checked, not a
      # fresh package of dist/extension. Same bytes on both registries.
      - name: Locate the universal vsix
        if: ${{ env.HAS_OPEN_VSX == 'true' }}
        id: universal
        run: |
          path=$(find artifacts/vsix -maxdepth 1 -name '*.vsix' \
            ! -name '*-win32-*' ! -name '*-linux-*' ! -name '*-darwin-*' \
            -print | sort | head -n 1)
          [ -n "$path" ] || {
            echo "::error::no universal vsix in artifacts/vsix"
            exit 1
          }
          echo "Publishing $path to Open VSX"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Publish to Open VSX Registry
        # Skip cleanly when no Open VSX PAT is configured (GitHub release only).
        if: ${{ env.HAS_OPEN_VSX == 'true' }}
        # v2.0.0
        uses: >-
          HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db
        id: publishToOpenVSX
        with:
          extensionFile: ${{ steps.universal.outputs.path }}
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
