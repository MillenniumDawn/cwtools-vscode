---
"on":
  # Push a v* tag to build, package, and publish the release. workflow_dispatch
  # is a manual fallback.
  push:
    tags:
      - "v*"
  workflow_dispatch:

name: Release

permissions:
  contents: read

# Never cancel an in-flight release; queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the Rust server natively on each platform. To add or remove a
  # platform, edit the matrix below -- the staging step is platform-agnostic.
  build-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bin: cwtools-server
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            bin: cwtools-server
          - os: windows-latest
            platform: win-x64
            target: x86_64-pc-windows-msvc
            bin: cwtools-server.exe
          - os: macos-latest
            platform: osx-arm64
            target: aarch64-apple-darwin
            bin: cwtools-server
          # Intel Macs. The client resolves osx-x64 there, so without this build
          # every Intel Mac install ends at "no language server binary found".
          # Cross-compiled from the arm64 runner; the Apple toolchain links both
          # slices, so only the rust target needs adding.
          - os: macos-latest
            platform: osx-x64
            target: x86_64-apple-darwin
            bin: cwtools-server
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ROOT: cwtools-rs/target
    steps:
      # The engine lives in-repo at cwtools-rs/, so the tag names both halves
      # at once: the commit being released is the engine being bundled.
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        # stable branch, 2026-03-27
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        # v2.9.1
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: cwtools-rs
      - name: Build server
        working-directory: cwtools-rs
        run: cargo build --release -p cwtools_lsp --target ${{ matrix.target }}
      - name: Upload binary
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-${{ matrix.platform }}
          path: >-
            ${{ env.ROOT }}/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  # Stage the binaries, package one vsix, and publish it.
  publish:
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Creating the GitHub release needs write access; GITHUB_TOKEN is read-only
    # by default.
    permissions:
      contents: write
    # Job-level so step `if:` and `run:` blocks can read them. Secrets aren't
    # visible in step conditions.
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
        with:
          # workflow_dispatch has no head_ref; fall back to the
          # dispatched branch.
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Download server binaries
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: server-*
          path: artifacts
      - name: Stage binaries into release/
        run: python3 scripts/stage_release_binaries.py artifacts release
      - uses: ./.github/actions/setup-node-npm
      - name: Require Marketplace token on tagged releases
        # Fail fast (before creating the GitHub release) when a real tag release
        # is missing the Marketplace PAT, instead of silently skipping the
        # publish.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            message="VSCE_TOKEN secret is not set; cannot publish"
            echo "::error::$message a tagged release to the Marketplace."
            exit 1
          fi
      # One vsix per platform plus a universal fallback. No clean, no server
      # rebuild: the binaries are already staged under release/bin/server.
      - name: Package vsix
        env:
          TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npm run build -- package-prebuilt
      # Checks every packaged vsix. The per-platform ones carry exactly their
      # own binary, while the universal fallback carries all of them. The
      # platform list is passed explicitly so a silently shrunken build matrix
      # fails here. Runs before the publish, so a broken package can't reach the
      # Marketplace.
      - name: Smoke test vsix
        run: |
          python3 scripts/smoke_test_vsix.py temp \
            linux-x64 linux-arm64 win-x64 osx-arm64 osx-x64
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # VSCE_TOKEN is inherited from the job-level env (build.ts reads it).
          # The version comes from the pushed tag; the build doesn't commit or
          # re-tag.
          TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npm run build -- publish-prebuilt
      - name: Publish to Open VSX Registry
        # Skip cleanly when no Open VSX PAT is configured (GitHub release only).
        if: ${{ env.OPEN_VSX_TOKEN != '' }}
        # v2.0.0
        uses: >-
          HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db
        id: publishToOpenVSX
        with:
          packagePath: "./release"
          pat: ${{ env.OPEN_VSX_TOKEN }}
