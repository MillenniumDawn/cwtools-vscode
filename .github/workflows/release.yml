on:
  # Tag-driven release: push a v* tag and CI builds, packages, and publishes the
  # GitHub release at that tag. workflow_dispatch is kept as a manual fallback.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      username:
        description: Github username of the person triggering the release
        default: "tboby"
        required: true
      email:
        description: Email of the person triggering the release
        default: "th.boby@gmail.com"
        required: true


name: Release

jobs:
  # Build the Rust server natively on each platform. macOS uses the x86_64
  # target (osx-x64), which runs under Rosetta 2 on Apple Silicon; add
  # osx-arm64 here later for a native arm build.
  build-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bin: cwtools-server
          - os: windows-latest
            platform: win-x64
            target: x86_64-pc-windows-msvc
            bin: cwtools-server.exe
          - os: macos-latest
            platform: osx-x64
            target: x86_64-apple-darwin
            bin: cwtools-server
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout cwtools (Rust source)
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: MillenniumDawn/cwtools
        submodules: recursive
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        targets: ${{ matrix.target }}
    - name: Cache Rust build
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: cwtools-rs
    - name: Build server
      working-directory: cwtools-rs
      run: cargo build --release -p cwtools_lsp --target ${{ matrix.target }}
    - name: Upload binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: server-${{ matrix.platform }}
        path: cwtools-rs/target/${{ matrix.target }}/release/${{ matrix.bin }}
        if-no-files-found: error

  # Stage all three binaries into one release tree, package a single universal
  # vsix, and publish it.
  publish:
    needs: build-server
    runs-on: ubuntu-latest
    # Exposed at job level so the Open VSX step's `if:` can check whether a PAT
    # is configured (secrets aren't directly readable in step conditions).
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        # workflow_dispatch doesn't populate head_ref; fall back to the branch
        # the release was dispatched from instead of silently using the default.
        ref: ${{ github.head_ref || github.ref_name }}
        submodules: recursive
    - name: Download server binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: server-*
        path: artifacts
    - name: Stage binaries into release/
      run: |
        base=release/bin/server/cwtools-server
        install -D artifacts/server-linux-x64/cwtools-server     "$base/linux-x64/cwtools-server"
        install -D artifacts/server-osx-x64/cwtools-server       "$base/osx-x64/cwtools-server"
        install -D artifacts/server-win-x64/cwtools-server.exe   "$base/win-x64/cwtools-server.exe"
        chmod +x "$base/linux-x64/cwtools-server" "$base/osx-x64/cwtools-server"
        ls -R "$base"
    - name: Setup .NET Core
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: 9.0.x
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 20
    - run: npm install
    - name: Restore dotnet tools
      run: dotnet tool restore
    - name: Publish Release
      env:
        github-user: ${{ github.event.inputs.username }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        vsce-token: ${{ secrets.VSCE_TOKEN }}
        user-email: ${{ github.event.inputs.email }}
        # When triggered by a pushed tag, the version comes from the tag
        # (GITHUB_REF_NAME) and the build skips committing/re-tagging.
        TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
      # Packages + publishes the staged binaries without cleaning the release
      # tree or rebuilding the server.
      run: dotnet run --project build -- -t ReleasePrebuilt
    - name: Publish to Open VSX Registry
      # Skip cleanly when no Open VSX PAT is configured (GitHub release only).
      if: ${{ env.OPEN_VSX_TOKEN != '' }}
      uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2
      id: publishToOpenVSX
      with:
        packagePath: "./release"
        pat: ${{ env.OPEN_VSX_TOKEN }}
