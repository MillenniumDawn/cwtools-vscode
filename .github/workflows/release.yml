on:
  # Push a v* tag to build, package, and publish the release. workflow_dispatch
  # is a manual fallback.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

name: Release

permissions:
  contents: read

# Never cancel an in-flight release; queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the Rust server natively on each platform. To add or remove a
  # platform, edit the matrix below -- the staging step is platform-agnostic.
  build-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bin: cwtools-server
          - os: windows-latest
            platform: win-x64
            target: x86_64-pc-windows-msvc
            bin: cwtools-server.exe
          - os: macos-latest
            platform: osx-arm64
            target: aarch64-apple-darwin
            bin: cwtools-server
    runs-on: ${{ matrix.os }}
    steps:
    # The engine builds from the submodule gitlink, so one pinned pointer rules
    # both local and CI builds.
    - name: Checkout (with engine submodule)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    # A release must bundle a tagged engine, not whatever commit the submodule
    # happens to point at. Submodule checkouts don't fetch tags, so pull them
    # first.
    - name: Require a tagged engine
      shell: bash
      run: |
        git -C submodules/cwtools fetch --tags --force --depth=1 origin
        tag=$(git -C submodules/cwtools describe --tags --exact-match)
        echo "Bundled engine tag: $tag"
        echo "Bundled engine tag: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, 2026-03-27
      with:
        targets: ${{ matrix.target }}
    - name: Cache Rust build
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: submodules/cwtools/cwtools-rs
    - name: Build server
      working-directory: submodules/cwtools/cwtools-rs
      run: cargo build --release -p cwtools_lsp --target ${{ matrix.target }}
    - name: Upload binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: server-${{ matrix.platform }}
        path: submodules/cwtools/cwtools-rs/target/${{ matrix.target }}/release/${{ matrix.bin }}
        if-no-files-found: error

  # Stage the binaries, package one vsix, and publish it.
  publish:
    needs: build-server
    runs-on: ubuntu-latest
    # Creating the GitHub release needs write access; GITHUB_TOKEN is read-only
    # by default.
    permissions:
      contents: write
    # Job-level so step `if:`/`run:` blocks can read them (secrets aren't visible
    # in step conditions).
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # workflow_dispatch has no head_ref; fall back to the dispatched branch.
        ref: ${{ github.head_ref || github.ref_name }}
    - name: Download server binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: server-*
        path: artifacts
    - name: Stage binaries into release/
      run: .github/scripts/stage-release-binaries.sh artifacts release
    - uses: ./.github/actions/setup-node-npm
    - name: Require Marketplace token on tagged releases
      # Fail fast (before creating the GitHub release) when a real tag release
      # is missing the Marketplace PAT, instead of silently skipping the publish.
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: |
        if [ -z "$VSCE_TOKEN" ]; then
          echo "::error::VSCE_TOKEN secret is not set; cannot publish a tagged release to the Marketplace."
          exit 1
        fi
    - name: Publish Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # VSCE_TOKEN is inherited from the job-level env (build.ts reads it).
        # The version comes from the pushed tag; the build doesn't commit or
        # re-tag.
        TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
      # Packages and publishes the staged binaries. No clean, no server rebuild.
      run: npm run build -- release-prebuilt
    - name: Smoke test vsix
      run: |
        set -euo pipefail
        vsix=$(ls temp/*.vsix 2>/dev/null | head -1)
        if [ -z "$vsix" ]; then
          echo "::error::No .vsix file found in temp/"
          exit 1
        fi
        echo "Found vsix: $vsix"
        # Extract and verify server binaries are present
        workdir=$(mktemp -d)
        unzip -q "$vsix" -d "$workdir"
        # VSIX archives nest all extension content under extension/.
        root="$workdir/extension"
        echo "Checking for platform server binaries..."
        for platform in linux-x64 win-x64 osx-arm64; do
          bin="$root/bin/server/cwtools-server/$platform"
          if [ ! -d "$bin" ]; then
            echo "::error::Missing server binary directory: $platform"
            exit 1
          fi
          count=$(find "$bin" -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No files in server binary directory: $platform"
            exit 1
          fi
          echo "  $platform: $count file(s) OK"
        done
        # Verify extension manifest is valid JSON
        if ! python3 -m json.tool "$root/package.json" > /dev/null 2>&1; then
          echo "::error::extension package.json is not valid JSON"
          exit 1
        fi
        echo "Extension manifest: OK"
        rm -rf "$workdir"
        echo "Smoke test passed"
    - name: Publish to Open VSX Registry
      # Skip cleanly when no Open VSX PAT is configured (GitHub release only).
      if: ${{ env.OPEN_VSX_TOKEN != '' }}
      uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
      id: publishToOpenVSX
      with:
        packagePath: "./release"
        pat: ${{ env.OPEN_VSX_TOKEN }}
