# Every push to main becomes a Marketplace and Open VSX pre-release. The
# version is the odd minor above the current stable one, with the Actions run
# number as the patch; see prerelease_identity_from in scripts/build/build.py.
"on":
  push:
    branches:
      - main
  workflow_dispatch:

name: Pre-release

permissions:
  contents: read

# Unlike a release, a superseded pre-release build is worth cancelling: only
# the newest commit on main needs publishing.
concurrency:
  group: pre-release
  cancel-in-progress: true

jobs:
  build-server:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bin: cwtools-server
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            bin: cwtools-server
          - os: windows-latest
            platform: win-x64
            target: x86_64-pc-windows-msvc
            bin: cwtools-server.exe
          - os: macos-latest
            platform: osx-arm64
            target: aarch64-apple-darwin
            bin: cwtools-server
          - os: macos-latest
            platform: osx-x64
            target: x86_64-apple-darwin
            bin: cwtools-server
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ROOT: engine/target
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        # stable branch, 2026-03-27
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        # v2.9.1
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine
      - name: Build server
        working-directory: engine
        run: cargo build --release -p cwtools_lsp --target ${{ matrix.target }}
      - name: Upload binary
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-${{ matrix.platform }}
          path: >-
            ${{ env.ROOT }}/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build-server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      HAS_VSCE: ${{ secrets.VSCE_TOKEN != '' }}
      HAS_OPEN_VSX: ${{ secrets.OPEN_VSX_TOKEN != '' }}
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download server binaries
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: server-*
          path: artifacts/server
      - uses: ./.github/actions/setup-node-npm
      - name: Assemble extension
        run: npm run compile:release
      - name: Stage binaries into dist/extension
        run: >-
          python3 scripts/stage_release_binaries.py
          artifacts/server dist/extension
      - name: Resolve pre-release identity
        id: version
        run: >-
          python3 scripts/build/build.py prerelease-identity >> "$GITHUB_OUTPUT"
      - name: Package prerelease VSIX files
        env:
          CWTOOLS_BUILD_VERSION: ${{ steps.version.outputs.version }}
          CWTOOLS_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: npm run build -- package-prebuilt
      - name: Smoke test VSIX files
        run: |
          python3 scripts/smoke_test_vsix.py artifacts/vsix \
            linux-x64 linux-arm64 win-x64 osx-arm64 osx-x64
      - name: Upload pre-release artifact
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cwtools-pre-release-${{ steps.version.outputs.tag }}
          path: artifacts/vsix/*.vsix
          if-no-files-found: error
          retention-days: 14
      # publish-marketplace, not publish-prebuilt: the GitHub prerelease is
      # created below, and a pre-release version has no CHANGELOG section for
      # publish-prebuilt to draw release notes from.
      - name: Publish pre-release to the Marketplace
        if: ${{ env.HAS_VSCE == 'true' }}
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
          CWTOOLS_BUILD_VERSION: ${{ steps.version.outputs.version }}
          CWTOOLS_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: npm run build -- publish-marketplace
      - name: Locate the universal vsix
        if: ${{ env.HAS_OPEN_VSX == 'true' }}
        id: universal
        run: |
          path=$(find artifacts/vsix -maxdepth 1 -name '*.vsix' \
            ! -name '*-win32-*' ! -name '*-linux-*' ! -name '*-darwin-*' \
            -print | sort | head -n 1)
          [ -n "$path" ] || {
            echo "::error::no universal vsix in artifacts/vsix"
            exit 1
          }
          echo "Publishing $path to Open VSX"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Publish pre-release to Open VSX Registry
        if: ${{ env.HAS_OPEN_VSX == 'true' }}
        # v2.0.0
        uses: >-
          HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db
        with:
          extensionFile: ${{ steps.universal.outputs.path }}
          preRelease: true
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="Automated pre-release build from commit $GITHUB_SHA.

          Pick the VSIX for your platform, or use the universal VSIX. The same
          build is published to the VS Code Marketplace and Open VSX on the
          pre-release channel, so installing from there gets you this build."
          gh release create "$TAG" artifacts/vsix/*.vsix \
            --target "$GITHUB_SHA" \
            --title "Pre-release $VERSION" \
            --notes "$notes" \
            --prerelease
