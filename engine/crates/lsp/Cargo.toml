[package]
name = "cwtools_lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Both halves. `src/main.rs` is a thin `fn main`; everything else lives in the
# library so `benches/` can link against it (#471).
[[bin]]
name = "cwtools-server"
path = "src/main.rs"

[lib]
name = "cwtools_lsp"
path = "src/lib.rs"

[[bench]]
name = "document_symbol"
harness = false

[dependencies]
cwtools_parser = { workspace = true }
cwtools_string_table = { workspace = true }
cwtools_file_manager = { workspace = true }
cwtools_rules = { workspace = true }
cwtools_validation = { workspace = true }
cwtools_error_codes = { workspace = true }
cwtools_i18n = { workspace = true }
cwtools_info = { workspace = true }
cwtools_driver = { workspace = true }
cwtools_game = { workspace = true }
cwtools_localization = { workspace = true }
cwtools_cache = { workspace = true }
cwtools_profiling = { workspace = true }
tower-lsp = { workspace = true }
tokio = { workspace = true, features = ["time", "fs", "io-util", "sync"] }
serde_json = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = [
    "std",
    "sink",
] }
# `tower::Service` is how a test drives an `LspService` handshake by hand;
# tower-lsp does not re-export the trait. Already in the lock file as one of
# its dependencies.
tower = { version = "0.5", default-features = false }
